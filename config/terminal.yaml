leveraged_etfs: [SOXL, TQQQ, NVDL, TSLL, LABU]

# Daily focus filter: a stock is shown only if it passes EVERY rule (reasons for exclusion are listed
# on the Data page and in the report). Set enabled: false to show the whole universe.
universe_filter:
  enabled: true
  beta_window: 120          # sessions for beta vs SPY
  min_beta: 1.3             # 120-session beta vs SPY
  min_hv60: 0.35            # 60-session annualised volatility (0.35 = 35%)
  min_market_cap: 2000000000   # USD; leveraged ETFs are exempt
  market_cap_refresh_days: 7   # market caps are cached and refreshed weekly

# Automatic universe expansion (config/universe_auto.yaml, rebuilt every refresh_days or with
# `python daily_run.py --rebuild-universe`): every US stock passing the universe_filter rules below,
# ranked by dollar volume, added after the core list above until max_size names.
universe_builder:
  enabled: true
  max_size: 500
  refresh_days: 30
  min_avg_shares: 500000      # coarse screener pass before the real dollar-volume rule

liquidity:
  min_price: 5.0                   # USD; below this the stock is excluded
  min_avg_dollar_volume: 100000000  # 20-day average of close x volume, USD (100M)
  good_avg_dollar_volume: 2000000000

scanner:
  shortlist_size: 40          # candidates (half per direction) that get the deep dive (>= 2 x final_list_size)
  final_list_size: 20         # candidates shown in the daily report per direction
  horizons: [3, 5, 7, 10]     # trading days for forward statistics
  plan_horizon_days: 7        # time stop of the standard swing plan
  min_reward_risk: 1.5        # T1 / stop distance below this -> "poor reward/risk" penalty
  max_stop_atr: 3.0           # structural stop further than this is capped and flagged
  min_stop_atr: 1.0           # stop never tighter than 1 ATR (daily noise)
  extension_atr: 3.0          # close more than N ATR above EMA21 = extended
  event_window_days: 7        # earnings within this many sessions = event risk for the swing
  slippage_bps: 10            # per side, used in the historical setup simulation

# Weights of the transparent composite score (sum = 100). Each component is a
# 0-100 sub-score; the composite is the weighted average minus penalties.
weights:
  trend: 20
  momentum: 15
  relative_strength: 15
  volume: 10
  setup_quality: 15
  reward_risk: 10
  liquidity: 5
  regime_alignment: 10

penalties:          # points subtracted from the composite (0-100 scale)
  earnings_in_window: 15
  extended: 10
  overbought_extreme: 5
  dilution_filing: 10
  financial_distress: 10
  poor_reward_risk: 10
  wide_stop: 5
  data_quality: 10
  options_event_premium: 5

tiers:              # composite score -> research priority tier
  A: 75
  B: 62
  C: 50

calendar:
  extra_closures: {}   # e.g. {"2026-12-31": "Unscheduled closure"}
