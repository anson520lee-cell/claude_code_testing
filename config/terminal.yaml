# ---------------------------------------------------------------------------
# Settings for the quantitative swing trading research terminal
# (daily_run.py + serve.py). The single-ticker tool (analyze.py) keeps using
# config/settings.yaml.
#
# This is a RESEARCH tool. Nothing here places, routes or simulates live orders.
# ---------------------------------------------------------------------------

paths:
  database: "data/stock_research.db"     # shared with analyze.py (new tables are added, nothing is dropped)
  reports_dir: "reports/daily"           # reports/daily/<YYYY-MM-DD>/
  cache_dir: "data/cache"                # SEC / options / profile caches
  backups_dir: "data/backups"            # database copies made before schema upgrades

data:
  history_period: "2y"         # first download per symbol (EMA250 + 1y percentiles need ~500 sessions)
  refresh_days: 15             # later runs re-download only the last N calendar days (cheap, idempotent)
  min_history_days: 260        # fewer sessions -> symbol excluded from scoring (EMA250 warm-up)
  settle_minutes: 30           # wait this long after the close before a session counts as "completed"
  download_attempts: 3
  retry_wait_seconds: 2
  # SEC EDGAR requires a User-Agent that identifies YOU (name + email), see
  # https://www.sec.gov/os/accessing-edgar-data - requests without one are refused (HTTP 403).
  # Set it in the environment rather than in this file:   export SEC_USER_AGENT="Jane Doe jane@example.com"
  # Without it, fundamentals fall back to Yahoo quarterly statements and SEC filings are unavailable.
  sec_user_agent: null

market:
  indices: ["SPY", "QQQ", "IWM", "DIA"]
  volatility: ["^VIX", "^VIX3M"]
  credit_rates: ["HYG", "IEF", "TLT"]          # credit spread proxy (HYG/IEF) and duration
  yields_fred: ["DGS2", "DGS10", "DGS3MO"]      # FRED constant-maturity Treasury yields (%)
  sector_etfs:
    XLK: "Technology"
    XLC: "Communication Services"
    XLY: "Consumer Discretionary"
    XLP: "Consumer Staples"
    XLE: "Energy"
    XLF: "Financials"
    XLV: "Health Care"
    XLI: "Industrials"
    XLB: "Materials"
    XLRE: "Real Estate"
    XLU: "Utilities"
  industry_etfs:
    SMH: "Semiconductors"
    XBI: "Biotech"
    KRE: "Regional Banks"
    ITA: "Aerospace & Defense"
  offensive_sectors: ["XLK", "XLY", "XLC"]
  defensive_sectors: ["XLP", "XLU", "XLV"]

