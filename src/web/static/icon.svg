<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202024"/><stop offset=".55" stop-color="#0b0b0d"/><stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".86" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".75" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".35" stop-color="#fff" stop-opacity=".06"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#e6e6e6" stop-opacity=".62"/><stop offset="1" stop-color="#9a9a9a" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".6" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <polygon points="440,100 584,100 820,924 204,924" fill="url(#beam)" opacity=".35"/>
    <polygon points="482,100 542,100 680,924 344,924" fill="url(#beam)" opacity=".55"/>
    <ellipse cx="512" cy="820" rx="330" ry="90" fill="url(#pool)"/>
    <!-- candles: wick + glass body, rising left to right -->
    <g stroke="#fff" stroke-opacity=".55" stroke-width="10" stroke-linecap="round">
      <line x1="300" y1="560" x2="300" y2="770"/><line x1="430" y1="500" x2="430" y2="720"/>
      <line x1="560" y1="400" x2="560" y2="650"/><line x1="690" y1="250" x2="690" y2="560"/>
    </g>
    <rect x="262" y="600" width="76" height="140" rx="18" fill="url(#glassDark)" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <rect x="392" y="540" width="76" height="150" rx="18" fill="url(#glassBody)"/>
    <rect x="522" y="450" width="76" height="170" rx="18" fill="url(#glassBody)"/>
    <rect x="652" y="300" width="76" height="220" rx="18" fill="url(#glassBody)"/>
    <g fill="#fff" fill-opacity=".85"><rect x="404" y="550" width="10" height="110" rx="5"/><rect x="534" y="460" width="10" height="130" rx="5"/><rect x="664" y="312" width="10" height="170" rx="5"/></g>
    <!-- trend line with glow -->
    <path d="M190 700 C 300 640, 360 520, 430 488 S 520 430, 560 372 S 650 236, 820 196" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" opacity="0.035"/>
    <path d="M190 700 C 300 640, 360 520, 430 488 S 520 430, 560 372 S 650 236, 820 196" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" opacity="0.06"/>
    <path d="M190 700 C 300 640, 360 520, 430 488 S 520 430, 560 372 S 650 236, 820 196" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" opacity="0.1"/>
    <path d="M190 700 C 300 640, 360 520, 430 488 S 520 430, 560 372 S 650 236, 820 196" fill="none" stroke="#fff" stroke-width="21" stroke-linecap="round" opacity="0.16"/>
    <path d="M190 700 C 300 640, 360 520, 430 488 S 520 430, 560 372 S 650 236, 820 196" fill="none" stroke="url(#line)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="820" cy="196" r="58" fill="#fff" opacity=".05"/>
    <circle cx="820" cy="196" r="40" fill="#fff" opacity=".10"/>
    <circle cx="820" cy="196" r="27" fill="#fff" opacity=".22"/>
    <circle cx="820" cy="196" r="15" fill="#fff"/>
    <!-- glass gloss over the upper half -->
    <path d="M100 100 H924 V430 C 700 360, 360 380, 100 470 Z" fill="#fff" opacity=".045"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
