<html lang="zh-Hant" data-theme="dark">
<head>

<link rel="icon" type="image/svg+xml" href="/static/icon.svg">

<body>
<div class="stage" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
<div class="grain" aria-hidden="true"></div>
<header class="topbar">
  <a class="brand" href="#/overview" aria-label="返回首頁"><img src="/static/icon.svg" alt=""><span class="wm">Swing <em>terminal</em></span></a>
  <nav id="nav">
    <a href="#/overview" data-view="overview">市場</a>
    <a href="#/scanner" data-view="scanner">候選股</a>

  </nav>
  <div class="right">
    <form id="jump" autocomplete="off"><input id="jump-input" placeholder="輸入代號" aria-label="打開股票"></form>

    <span id="regime-badge" class="badge">…</span>

  </div>
</header>
<div id="banner" class="banner hidden"></div>
<main id="app"><div class="loading">載入中…</div></main>
